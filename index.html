<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSEB Smart Learning for Kids</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 2.2em; }
        p { font-size: 1.2em; }
        
        .card-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            width: 140px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid #4caf50;
        }
        .card:hover { transform: scale(1.05); }
        .card h3 { color: #2e7d32; margin-bottom: 5px; }
        
        .btn-quiz {
            margin-top: 30px;
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
        }
        .btn-quiz:hover { background-color: #f50057; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 GSEB Smart Learning 🎨</h1>
        <p>રમતા રમતા શીખો - બાળ શિક્ષણ પોર્ટલ</p>
    </div>

    <h2>તમારું ધોરણ પસંદ કરો:</h2>

    <div class="card-container">
        <div class="card" onclick="alert('ધોરણ ૧ નું મટીરીયલ જલ્દી આવશે!')">
            <h3>🎈 ધોરણ ૧</h3>
        </div>
        <div class="card" onclick="alert('ધોરણ ૨ નું મટીરીયલ જલ્દી આવશે!')">
            <h3>🚀 ધોરણ ૨</h3>
        </div>
        <div class="card" onclick="alert('ધોરણ ૩ નું મટીરીયલ જલ્દી આવશે!')">
            <h3>🌟 ધોરણ ૩</h3>
        </div>
        <div class="card" onclick="alert('ધોરણ ૪ નું મટીરીયલ જલ્દી આવશે!')">
            <h3>🏆 ધોરણ ૪</h3>
        </div>
    </div>

    <button class="btn-quiz" onclick="alert('ક્વિઝ રમત ટૂંક સમયમાં શરૂ થશે!')">🎮 રમો અને શીખો (Quiz)</button>

</body>
</html>
