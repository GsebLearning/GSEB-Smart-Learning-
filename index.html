<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>તમારું ધોરણ પસંદ કરો</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(180deg, #e0f2fe 0%, #fef3c7 50%, #fce7f3 100%);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .heading {
            color: #0284c7;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Standard Grid Section */
        .std-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .std-card {
            background: #ffffff;
            border: 2px solid #60a5fa;
            border-radius: 20px;
            padding: 15px 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .std-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.15);
        }

        .std-icon {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .std-title {
            color: #1d4ed8;
            font-weight: 800;
            font-size: 1.1rem;
        }

        /* Quiz Box Section */
        .quiz-card {
            background: #ffffff;
            border: 3px dashed #f43f5e;
            border-radius: 24px;
            padding: 20px 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .quiz-header {
            font-size: 1.3rem;
            font-weight: 800;
            color: #000000;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .quiz-question {
            color: #ef4444;
            font-weight: 800;
            font-size: 1.15rem;
            margin-bottom: 18px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .opt-btn {
            background-color: #f6d06f;
            color: #27272a;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #d97706;
            transition: all 0.1s ease;
            flex: 1;
            min-width: 90px;
        }

        .opt-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #d97706;
        }

        .opt-btn.correct {
            background-color: #22c55e !important;
            color: white !important;
            box-shadow: 0 3px 0 #15803d !important;
        }

        .opt-btn.wrong {
            background-color: #ef4444 !important;
            color: white !important;
            box-shadow: 0 3px 0 #b91c1c !important;
        }

        .next-btn {
            margin-top: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: none;
        }

        /* Footer Banner Section */
        .footer-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .footer-title {
            color: #f87171;
            font-size: 1.3rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Title -->
        <div class="heading">
            <span>📚</span> તમારું ધોરણ પસંદ કરો:
        </div>

        <!-- Class Grid -->
        <div class="std-grid">
            <div class="std-card">
                <div class="std-icon">🎈</div>
                <div class="std-title">ધોરણ ૧</div>
            </div>
            <div class="std-card">
                <div class="std-icon">🚀</div>
                <div class="std-title">ધોરણ ૨</div>
            </div>
            <div class="std-card">
                <div class="std-icon">⭐</div>
                <div class="std-title">ધોરણ ૩</div>
            </div>
            <div class="std-card">
                <div class="std-icon">🦁</div>
                <div class="std-title">ધોરણ ૪</div>
            </div>
            <div class="std-card">
                <div class="std-icon">🎓</div>
                <div class="std-title">ધોરણ પ</div>
            </div>
            <div class="std-card">
                <div class="std-icon">🔬</div>
                <div class="std-title">ધોરણ ૬</div>
            </div>
            <div class="std-card">
                <div class="std-icon">📖</div>
                <div class="std-title">ધોરણ ૭</div>
            </div>
            <div class="std-card">
                <div class="std-icon">🏆</div>
                <div class="std-title">ધોરણ ૮</div>
            </div>
        </div>

        <!-- Dynamic Quiz Section (6 Questions) -->
        <div class="quiz-card">
            <div class="quiz-header">
                <span>🎮</span> રમત-રમતમાં જ્ઞાન (ક્વિઝ)
            </div>
            <div class="quiz-question" id="quiz-question-text">
                ગુજરાતનું પાટનગર કયું છે?
            </div>
            <div class="options-container" id="options-container">
                <!-- Options rendered via JS -->
            </div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">આગળનો પ્રશ્ન ➡️</button>
        </div>

        <!-- Footer Section -->
        <div class="footer-card">
            <span style="font-size: 1.8rem;">📺</span>
            <div class="footer-title">શૈક્ષણિક વિડીયો અને વાર્તાઓ</div>
        </div>

    </div>

    <script>
        // 6 Questions Array
        const quizData = [
            {
                q: "૧. ગુજરાતનું પાટનગર કયું છે?",
                opts: ["અમદાવાદ", "ગાંધીનગર", "સુરત"],
                ans: 1
            },
            {
                q: "૨. ભારતનો રાષ્ટ્રીય પક્ષી કયો છે?",
                opts: ["મોર", "પોપટ", "કબૂતર"],
                ans: 0
            },
            {
                q: "૩. સૂર્ય કઈ દિશામાં ઉગે છે?",
                opts: ["પશ્ચિમ", "ઉત્તર", "પૂર્વ"],
                ans: 2
            },
            {
                q: "૪. એક અઠવાડિયામાં કેટલા દિવસ હોય છે?",
                opts: ["૫", "૭", "૧૦"],
                ans: 1
            },
            {
                q: "૫. જંગલનો રાજા કોણ ગણાય છે?",
                opts: ["વાઘ", "વરુ", "સિંહ"],
                ans: 2
            },
            {
                q: "૬. આપણા દેશનું નામ શું છે?",
                opts: ["ભારત", "નેપાળ", "શ્રીલંકા"],
                ans: 0
            }
        ];

        let currentIdx = 0;

        function loadQuestion() {
            const currentQuiz = quizData[currentIdx];
            document.getElementById('quiz-question-text').innerText = currentQuiz.q;
            
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';

            currentQuiz.opts.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(btn, index, currentQuiz.ans);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedIdx, correctIdx) {
            const buttons = document.querySelectorAll('.opt-btn');
            
            // Disable all buttons once an option is picked
            buttons.forEach(btn => btn.onclick = null);

            if (selectedIdx === correctIdx) {
                selectedBtn.classList.add('correct');
            } else {
                selectedBtn.classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }

            // Show Next button or restart option
            const nextBtn = document.getElementById('next-btn');
            if (currentIdx < quizData.length - 1) {
                nextBtn.innerText = 'આગળનો પ્રશ્ન ➡️';
            } else {
                nextBtn.innerText = 'ફરીથી રમો 🔄';
            }
            nextBtn.style.display = 'inline-block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx >= quizData.length) {
                currentIdx = 0; // Loop back to first question
            }
            loadQuestion();
        }

        // Initialize quiz
        loadQuestion();
    </script>
</body>
</html>
