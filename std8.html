<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ધોરણ ૮ - GSEB Smart Learning</title>
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #e0f7fa, #fff9c4); margin: 0; padding: 15px; text-align: center; }
        
        header { 
            background: linear-gradient(45deg, #ff7e5f, #feb47b); 
            color: white; 
            padding: 15px; 
            border-radius: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 1.8em; }
        
        .btn-back { 
            display: inline-block; 
            margin-top: 10px; 
            padding: 6px 15px; 
            background: #2e86de; 
            color: white; 
            text-decoration: none; 
            border-radius: 20px; 
            font-size: 0.9em;
        }

        .container { max-width: 700px; margin: 20px auto; }

        /* Grid for Subjects & Chapters */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        
        .box-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            cursor: pointer; 
            border: 3px solid #ff9f43; 
            transition: transform 0.2s; 
        }
        .box-card:hover { transform: scale(1.05); }
        .box-icon { font-size: 2.2em; }
        .box-title { font-weight: bold; margin-top: 8px; color: #2f3542; }

        /* Content Section */
        .content-card { 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            text-align: left; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-left: 6px solid #10ac84;
        }

        .qa-box { background: #f1f2f6; padding: 10px 15px; margin: 10px 0; border-radius: 10px; }
        .question { font-weight: bold; color: #1e3799; }
        .answer { color: #079992; margin-top: 4px; }

        .quiz-opt { background: #54a0ff; color: white; border: none; padding: 8px 15px; margin: 5px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        /* Hidden Class for Steps */
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">🎓 ધોરણ ૮ (Class 8) 🎓</h1>
        <a href="index.html" class="btn-back">🏠 મુખ્ય હોમ પેજ</a>
    </header>

    <div class="container">

        <!-- STEP 1: વિષય પસંદગી (Subject Selection) -->
        <div id="step-subjects">
            <h2 style="color: #ee5253;">📘 વિષય પસંદ કરો:</h2>
            <div class="grid">
                <div class="box-card" onclick="selectSubject('science')">
                    <div class="box-icon">🔬</div>
                    <div class="box-title">વિજ્ઞાન (Science)</div>
                </div>
                <div class="box-card" onclick="selectSubject('maths')">
                    <div class="box-icon">📐</div>
                    <div class="box-title">ગણિત (Maths)</div>
                </div>
            </div>
        </div>

        <!-- STEP 2: પ્રકરણ પસંદગી (Chapter Selection) -->
        <div id="step-chapters" class="hidden">
            <button onclick="goBackToSubjects()" class="btn-back" style="background:#10ac84; margin-bottom:15px;">⬅️ વિષય બદલો</button>
            <h2 id="subject-title" style="color: #10ac84;">પ્રકરણ પસંદ કરો:</h2>
            <div class="grid" id="chapter-list">
                <!-- Chapters will be loaded here dynamically -->
            </div>
        </div>

        <!-- STEP 3: પ્રશ્નો અને ક્વિઝ (Questions & Quiz Content) -->
        <div id="step-content" class="hidden">
            <button onclick="goBackToChapters()" class="btn-back" style="background:#ee5253; margin-bottom:15px;">⬅️ પ્રકરણોની યાદી</button>
            
            <div class="content-card">
                <h2 id="chapter-heading" style="color: #ff9f43; margin-top: 0;"></h2>
                
                <h3>❓ ૧ ગુણના પ્રશ્નો:</h3>
                <div id="qa-container"></div>

                <hr style="border: 1px dashed #ccc; margin: 20px 0;">

                <h3>🎮 ઓનલાઇન ક્વિઝ ટેસ્ટ:</h3>
                <div id="quiz-container"></div>
            </div>
        </div>

    </div>

    <script>
        let currentSubject = '';

        // વિજ્ઞાન અને ગણિતના પ્રકરણોનો ડેટા
        const data = {
            science: {
                title: "🔬 વિજ્ઞાનના પ્રકરણો",
                chapters: [
                    { id: 1, name: "પ્રકરણ ૧: પાક ઉત્પાદન અને વ્યવસ્થાપન", icon: "🌾" },
                    { id: 2, name: "પ્રકરણ ૨: સૂક્ષ્મજીવો: મિત્ર અને શત્રુ", icon: "🦠" },
                    { id: 3, name: "પ્રકરણ ૩: કોલસો અને પેટ્રોલિયમ", icon: "🛢️" }
                ]
            },
            maths: {
                title: "📐 ગણિતના પ્રકરણો",
                chapters: [
                    { id: 1, name: "પ્રકરણ ૧: સંમેય સંખ્યાઓ", icon: "🔢" },
                    { id: 2, name: "પ્રકરણ ૨: એકચલ રૈખિક સમીકરણ", icon: "➕" },
                    { id: 3, name: "પ્રકરણ ૩: ચતુષ્કોણની સમજ", icon: "🔳" }
                ]
            }
        };

        // વિષય સિલેક્ટ કરવા પર
        function selectSubject(sub) {
            currentSubject = sub;
            document.getElementById('step-subjects').classList.add('hidden');
            document.getElementById('step-chapters').classList.remove('hidden');
            
            document.getElementById('subject-title').innerText = data[sub].title;
            
            let chapterHTML = '';
            data[sub].chapters.forEach(ch => {
                chapterHTML += `
                    <div class="box-card" onclick="loadChapterContent(${ch.id})">
                        <div class="box-icon">${ch.icon}</div>
                        <div class="box-title">${ch.name}</div>
                    </div>`;
            });
            document.getElementById('chapter-list').innerHTML = chapterHTML;
        }

        // પ્રકરણ પર ક્લિક કરવાથી કન્ટેન્ટ લોડ થશે
        function loadChapterContent(chId) {
            document.getElementById('step-chapters').classList.add('hidden');
            document.getElementById('step-content').classList.remove('hidden');

            if(currentSubject === 'science' && chId === 1) {
                // પ્રકરણ ૧ વિજ્ઞાનનો ડેટા
                document.getElementById('chapter-heading').innerText = "🌾 પ્રકરણ ૧: પાક ઉત્પાદન અને વ્યવસ્થાપન";
                
                document.getElementById('qa-container').innerHTML = `
                    <div class="qa-box">
                        <div class="question">૧. પાક એટલે શું?</div>
                        <div class="answer">ઉત્તર: એક જ સ્થાન પર મોટા પ્રમાણમાં ઉગાડવામાં આવતા એક જ પ્રકારના છોડને પાક કહે છે.</div>
                    </div>
                    <div class="qa-box">
                        <div class="question">૨. જમીનને પોચી કરવા કયું સાધન વપરાય છે?</div>
                        <div class="answer">ઉત્તર: હળ (Plough)</div>
                    </div>`;

                document.getElementById('quiz-container').innerHTML = `
                    <p><b>સવાલ: કયો ખરીફ (ચોમાસાનો) પાક છે?</b></p>
                    <button class="quiz-opt" onclick="alert('❌ ખોટો જવાબ!')">ઘઉં</button>
                    <button class="quiz-opt" onclick="alert('🎉 સાચો જવાબ!')">ડાંગર</button>`;
            } else {
                // અન્ય પ્રકરણો માટે મેસેજ
                document.getElementById('chapter-heading').innerText = "📚 પ્રકરણ સામગ્રી";
                document.getElementById('qa-container').innerHTML = "<p>આ પ્રકરણના પ્રશ્નો ટૂંક સમયમાં મુકાશે!</p>";
                document.getElementById('quiz-container').innerHTML = "<p>આ પ્રકરણની ટેસ્ટ ટૂંક સમયમાં મુકાશે!</p>";
            }
        }

        // પાછા જવા માટેના ફંક્શન્સ
        function goBackToSubjects() {
            document.getElementById('step-chapters').classList.add('hidden');
            document.getElementById('step-subjects').classList.remove('hidden');
        }

        function goBackToChapters() {
            document.getElementById('step-content').classList.add('hidden');
            document.getElementById('step-chapters').classList.remove('hidden');
        }
    </script>

</body>
</html>
